<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <title>Results — SkillFit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <a class="brand" href="index.html">
        <div class="brand-icon">🎯</div>
        <span class="brand-name">Skill<em>Fit</em></span>
    </a>

    <div id="authNavArea">
        <button class="login-btn" id="loginBtn" onclick="openAuth()">
            Login / Signup
        </button>

        <div class="account-menu hidden" id="accountMenu">
            <div class="account-trigger" onclick="toggleAccountDropdown()">
                <div class="account-avatar" id="accountAvatar">U</div>
                <span id="accountUsername">User</span>
            </div>
            <div class="account-dropdown hidden" id="accountDropdown">
                <div class="account-email" id="accountEmail"></div>
                <button onclick="logoutUser()">Logout</button>
            </div>
        </div>
    </div>
</header>


<section class="results-hero">
    <div class="hero-pill">
        <span class="hero-pill-dot"></span>
        Analysis Complete
    </div>
    <h2>Skill Match Results</h2>
    <p id="resultsSummary">Candidates ranked by skill compatibility</p>
</section>

<!-- Search + Sort controls -->
<div class="controls-bar">
    <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input
            type="text"
            class="search-input"
            id="searchInput"
            placeholder="Search candidate name…"
            oninput="filterResults()"
        >
    </div>
    <select class="sort-select" id="sortSelect" onchange="filterResults()">
        <option value="highest">↓ Highest Match</option>
        <option value="lowest">↑ Lowest Match</option>
    </select>
</div>

<div class="results-container" id="resultsContainer">
    <p class="no-results-msg" id="noResultsMsg">No candidates match your search.</p>
</div>
<div id="authModal" class="auth-modal hidden">
  <div class="auth-card">

    <div class="auth-header">
      <h3 id="authTitle">Login</h3>
      <button onclick="closeAuth()">✕</button>
    </div>

    <input type="text" id="authUsername" placeholder="Username">

    <input type="email" id="authEmail" placeholder="Email" class="signup-only">

    <input type="password" id="authPassword" placeholder="Password">

    <input type="password" id="authConfirmPassword"
        placeholder="Confirm Password"
        class="signup-only">

    <button class="primary-btn auth-submit" onclick="handleAuth()" id="authBtn">
      Login
    </button>

    <p class="auth-switch">
        <span id="authSwitchText">Don't have an account?</span>
        <a href="#" id="authSwitchLink" >
    Create account
    </a>
    </p>


  </div>
</div>
<div id="otpModal" class="auth-modal hidden">
  <div class="auth-card">

    <div class="auth-header">
      <h3>Verify Email</h3>
    </div>

    <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:10px;">
        Enter the verification code sent to your email.
    </p>

    <input type="text" id="otpCode" placeholder="Enter OTP">

    <button class="primary-btn auth-submit" onclick="confirmOTP()">
        Verify Account
    </button>

  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<!-- <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1480.0.min.js"></script> -->
<script src="https://unpkg.com/aws-amplify@4.3.32/dist/aws-amplify.min.js"></script>
<script src="script.js"></script>
</body>
</html>
